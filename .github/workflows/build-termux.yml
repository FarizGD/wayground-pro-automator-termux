name: Build Termux ARM64 bundle

on:
  push:
    branches: [main]
    paths:
      - "src/tui.py"
      - "requirements-termux.txt"
      - "packaging/termux/**"
      - ".github/workflows/build-termux.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-aarch64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable ARM64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build inside Termux ARM64 container and bundle dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/bundle/wheels
          docker run --rm --privileged --platform linux/arm64 --security-opt seccomp=unconfined \
            -v "$PWD:/work" -w /work termux/termux-docker:aarch64 \
            bash -lc '
              set -euo pipefail
              pkg update
              pkg install -y python rust clang make
              python -m py_compile src/tui.py
              python -m pip install wheel
              python -m pip wheel --wheel-dir dist/bundle/wheels -r requirements-termux.txt
              cp src/tui.py dist/bundle/tui.py
              cp requirements-termux.txt dist/bundle/requirements-termux.txt
              python --version > dist/bundle/BUILT_WITH_PYTHON.txt
              uname -m > dist/bundle/BUILT_FOR.txt
            '

          cat > dist/bundle/wayground-tui <<'LAUNCHER'
          #!/data/data/com.termux/files/usr/bin/bash
          set -euo pipefail
          APP_DIR="$(cd -- "$(dirname -- "$0")" && pwd)"
          PYTHON="$PREFIX/bin/python"
          if [ ! -x "$PYTHON" ]; then
            echo "Termux Python is required. Install it with: pkg install python" >&2
            exit 1
          fi
          exec "$PYTHON" "$APP_DIR/tui.py" "$@"
          LAUNCHER
          chmod 0755 dist/bundle/wayground-tui

          cat > dist/bundle/install.sh <<'INSTALLER'
          #!/data/data/com.termux/files/usr/bin/bash
          set -euo pipefail
          APP_DIR="$(cd -- "$(dirname -- "$0")" && pwd)"
          : "${PREFIX:?Run this installer inside Termux}"
          PYTHON="$PREFIX/bin/python"
          if [ ! -x "$PYTHON" ]; then
            echo "Installing Termux Python..."
            pkg install -y python
          fi
          echo "Installing bundled Python packages offline..."
          "$PYTHON" -m pip install --no-index --find-links "$APP_DIR/wheels" -r "$APP_DIR/requirements-termux.txt"
          mkdir -p "$PREFIX/opt/wayground-termux" "$PREFIX/bin"
          cp "$APP_DIR/tui.py" "$PREFIX/opt/wayground-termux/tui.py"
          cp "$APP_DIR/requirements-termux.txt" "$PREFIX/opt/wayground-termux/requirements-termux.txt"
          cp -a "$APP_DIR/wheels" "$PREFIX/opt/wayground-termux/"
          cat > "$PREFIX/bin/wayground-tui" <<'RUNNER'
          #!/data/data/com.termux/files/usr/bin/bash
          set -euo pipefail
          exec "$PREFIX/bin/python" "$PREFIX/opt/wayground-termux/tui.py" "$@"
          RUNNER
          chmod 0755 "$PREFIX/bin/wayground-tui"
          echo "Installed. Run: wayground-tui"
          INSTALLER
          chmod 0755 dist/bundle/install.sh

          cat > dist/bundle/README.txt <<'README'
          Wayground Termux ARM64 bundle

          Requirements:
            - Android running Termux for aarch64
            - Termux Python installed by the installer if missing

          Install:
            1. Extract this archive in Termux-accessible storage.
            2. Run: bash install.sh
            3. Run: wayground-tui

          Python dependencies are bundled as wheels and installed offline.
          This bundle is built for the Python version shown in BUILT_WITH_PYTHON.txt.
          It is not a standalone native ELF binary and still requires Termux's Python runtime.
          README

          tar -czf dist/wayground-termux-aarch64.tar.gz -C dist bundle
          sha256sum dist/wayground-termux-aarch64.tar.gz > dist/wayground-termux-aarch64.tar.gz.sha256

      - name: Upload ARM64 bundle
        uses: actions/upload-artifact@v4
        with:
          name: wayground-termux-aarch64
          path: |
            dist/wayground-termux-aarch64.tar.gz
            dist/wayground-termux-aarch64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
